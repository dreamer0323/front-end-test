# 静态网站 Nginx 配置模板
# 把这个文件复制到服务器 /etc/nginx/sites-available/ 后按需修改
server {
    # 监听 80 端口（HTTP）。等有域名+备案后，可再配 443 + SSL。
    listen 80;
    listen [::]:80;

    # 服务器名：填你的公网 IP 或域名，二选一
    server_name _;

    # 网站根目录：前端静态文件的存放位置
    root /var/www/front-end-test;
    index index.html;

    # 静态资源默认缓存策略（对 html 之外的文件友好）
    location / {
        try_files $uri $uri/ =404;
    }

    # 关闭 nginx 版本号泄露（安全习惯）
    server_tokens off;
}
